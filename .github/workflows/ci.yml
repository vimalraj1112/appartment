name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: superlink
          POSTGRES_PASSWORD: superlink_dev_pw
          POSTGRES_DB: superlink_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U superlink -d superlink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://superlink:superlink_dev_pw@localhost:5433/superlink_test
      TEST_DATABASE_URL: postgresql://superlink:superlink_dev_pw@localhost:5433/superlink_test
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -w @superlink/api
      - run: npm run build
