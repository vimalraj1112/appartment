# Render Blueprint for SuperLink Community (monorepo)
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
# It provisions a Postgres database, the API (Node), and the web app (static).

databases:
  - name: superlink-db
    plan: free
    region: singapore
    databaseName: superlink
    user: superlink

services:
  # ---------------- API (Express + Prisma) ----------------
  - type: web
    name: superlink-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w @superlink/shared &&
      npx prisma generate --schema apps/api/prisma/schema.prisma &&
      npm run build -w @superlink/api
    startCommand: >-
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
      node apps/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: superlink-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Public URL of the web static site (used for CORS + email links).
      # Change if Render assigns a different hostname.
      - key: WEB_URL
        value: https://superlink-web.onrender.com
      - key: CORS_ORIGIN
        value: https://superlink-web.onrender.com
      - key: API_BASE_URL
        value: https://superlink-web.onrender.com/api/v1
      - key: PAYMENT_PROVIDER
        value: MOCK
      - key: LLM_PROVIDER
        value: MOCK

  # ---------------- Web (Vite static site) ----------------
  - type: web
    name: superlink-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: >-
      npm ci &&
      npm run build -w @superlink/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # Relative base so the browser calls the same origin, which Render
      # rewrites to the API service (this keeps the refresh cookie first-party).
      - key: VITE_API_URL
        value: /api/v1
      - key: VITE_WHATSAPP_NUMBER
        value: "919000000000"
    routes:
      # Proxy API + websocket traffic to the API service.
      - type: rewrite
        source: /api/*
        destination: https://superlink-api.onrender.com/api/*
      - type: rewrite
        source: /socket.io/*
        destination: https://superlink-api.onrender.com/socket.io/*
      # SPA fallback so client-side routes (/login, /app, ...) work.
      - type: rewrite
        source: /*
        destination: /index.html
